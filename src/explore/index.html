<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeC | Explore</title>
    <link rel="icon" type="image/svg+xml" href="../images/logos/logo.svg">
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/explore.js" type="module"></script>
  </head>

  <body>
    <header class="divider site-header" id="main-header"></header>
    <section class="search-bar-container hero" id="search">
      <h1>Explore Titles</h1>
      <form class="search-form" id="search-form" method="GET" action="/explore/">
        <input
          type="search"
          name="search"
          id="search-input"
          placeholder="Search for a title..."
          class="search-bar"
          required
        />
        <button type="submit" id="search-button" class="search-submit-btn">Search</button>
      </form>
    </section>

    <main class="main-container">

      <!-- Mobile Toggle Button -->
      <button id="filter-toggle" class="filter-toggle-btn" aria-label="Open Filters">
        Filter & Sort
      </button>
      <aside class="filter-sidebar" id="filter-section">
        <h2 class="filter-header">Filters</h2>
        <button id="filter-close" class="filter-close-btn" aria-label="Close Filters">&times;</button>

        <form class="filter-form" id="filter-form" method="GET" action="/explore/">
          <fieldset class="form-group">
            <legend>ALL ENTERTAINMENT</legend>
            <div class="filter-group">
              <label for="year-filter">Release Year</label>
              <select id="year-filter" name="year">
                <option value="">Any</option>
                <option value="2020">2020 until present</option>
                <option value="2010-2019">2010 - 2019</option>
                <option value="2000-2009">2000 - 2009</option>
                <option value="1999">1999 and before</option>
              </select>
            </div>
            <div class="filter-group">
              <label for="genre-filter">Genre</label>
              <select id="genre-filter" name="genre">
                <option value="">All genres</option>
                <option value="action">Action</option>
                <option value="adventure">Adventure</option>
                <option value="sci-fi">Sci-fi</option>
                <option value="drama">Drama</option>
                <option value="horror">Horror</option>
              </select>
            </div>
          </fieldset>
          <fieldset class="form-group">
            <legend>VIDEO GAMES</legend>
            <div class="filter-group">
              <label for="platform-filter">Platform</label>
              <select id="platform-filter" name="platform">
                <option value="">All</option>
                <option value="pc">PC</option>
                <option value="playstation">PlayStation</option>
                <option value="xbox">X Box</option>
                <option value="nintendo">Nintendo</option>
              </select>
            </div>
          </fieldset>
          <fieldset class="form-group">
            <legend>MOVIES & SERIES</legend>
            <div class="filter-group-check">
              <label for="movies"><input type="checkbox" id="movies" name="movies" checked>Movies</label>
              <label for="series"><input type="checkbox" id="series" name="series" checked>Series</label>
            </div>
          </fieldset>
          <button type="submit" id="apply-filters" class="apply-btn">Apply Filters</button>
        </form>
      </aside>

      <!-- Will be populated using JavaScript -->
      <section class="flex flex-wrap" id="games-container">
        <h2 class="section-header">Video games</h2>
      </section>
      <section class="flex flex-wrap" id="movies-container">
        <h2 class="section-header">Movies & Series</h2>
      </section>
    </main>

    <footer class="divider footer" id="main-footer"></footer>
  </body>
</html>
